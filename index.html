<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Candidatos para proyecto WICOM en Guanacaste</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #0f1420;
    color: #e6e9f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 20px 0;
    color: #f5f7fb;
  }
  .grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .card {
    background: #161c2c;
    border: 1px solid #232c42;
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: #aab3c8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #map {
    height: 600px;
    width: 100%;
    border-radius: 8px;
  }
  .chart-wrap {
    position: relative;
    height: 600px;
    width: 100%;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #232c42;
  }
  th {
    color: #8892a8;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  tr:hover td { background: #1c2439; }
  .tier1 { color: #59d18a; font-weight: 600; }
  .tier2 { color: #5aa9e6; font-weight: 600; }
  .tier3 { color: #e6c65a; font-weight: 600; }
  .tier4 { color: #e6905a; font-weight: 600; }
  .tier5 { color: #b0b8cc; font-weight: 600; }
  .cv-link {
    color: #6fb1ff;
    text-decoration: none;
    font-weight: 500;
  }
  .cv-link:hover { text-decoration: underline; }
  .summary-table td.num, .summary-table th.num { text-align: center; }
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .leaflet-tooltip.dark-tip {
    background: #161c2c;
    color: #e6e9f0;
    border: 1px solid #232c42;
    font-size: 12px;
  }
  .leaflet-popup-content-wrapper {
    background: #161c2c;
    color: #e6e9f0;
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: #161c2c; }
  .leaflet-popup-content a { color: #6fb1ff; }
  .leaflet-tile-pane { filter: brightness(0.85) contrast(1.05); }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>Candidatos para proyecto WICOM en Guanacaste</h1>

  <div class="grid">
    <div class="card">
      <h2>Mapa de candidatos</h2>
      <div id="map"></div>
    </div>
    <div class="card">
      <h2>Distancia a Guanacaste (km)</h2>
      <div class="chart-wrap"><canvas id="distChart"></canvas></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Honorarios pretendidos (CRC)</h2>
      <div class="chart-wrap"><canvas id="feeChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Promedio por rol</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>Rol</th>
            <th class="num">Candidatos</th>
            <th class="num">Distancia prom. (km)</th>
            <th class="num">Honorario prom. (CRC)</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Detalle de candidatos</h2>
    <table>
      <thead>
        <tr>
          <th>Candidato</th>
          <th>Rol</th>
          <th>Ubicación</th>
          <th>Distancia (km)</th>
          <th>Honorario (CRC)</th>
          <th>CV</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
const center = { nombre: "Guanacaste (Liberia)", lat: 10.6335, lng: -85.4380 };

const data = [
  { nombre: "Yerlan Daniel Gomez Hernandez", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Nicoya, Guanacaste, Costa Rica", lat: 10.1483, lng: -85.4519, distancia: 80.2, honorario: 600000, cv: "https://drive.google.com/file/d/1jO0Xo9-Jx4ZunVBPGpXk0wwScIOh6DNo/view?usp=drive_link" },
  { nombre: "Levy Centeno Castellon", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Alajuela, Desamparados, Costa Rica", lat: 10.0159, lng: -84.2116, distancia: 243.0, honorario: 560000, cv: "https://drive.google.com/file/d/1J4OAZVoRyJSdVEZ8UEJBLj3i_v1vODAY/view?usp=drive_link" },
  { nombre: "Johan Aguilar Brenes", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Alajuela, Desamparados, Costa Rica", lat: 10.0159, lng: -84.2116, distancia: 243.0, honorario: 560000, cv: "https://drive.google.com/file/d/19RU9e-vgRqGi1W-wHjDpefy4-xuBcjtC/view?usp=drive_link" },
  { nombre: "Johel Jose González Siles", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Mogote, Guanacaste, Costa Rica", lat: 10.5000, lng: -85.3167, distancia: 90.0, honorario: 650000, cv: "https://drive.google.com/file/d/1BRogOUrNhUG-i_woJxZFBdCq-CQssiMF/view?usp=drive_link" },
  { nombre: "Moisés Rojas Rodríguez", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Tilarán, Guanacaste, Costa Rica", lat: 10.4670, lng: -84.9678, distancia: 110.0, honorario: 550000, cv: "https://drive.google.com/file/d/1YWlT5DoxyBFfiBNZRkd3Hh74rUtn09f9/view?usp=drive_link" },
  { nombre: "Samuel Rodriguez Vega", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Cartago, Costa Rica", lat: 9.8630, lng: -83.9170, distancia: 270.0, honorario: 600000, cv: "https://drive.google.com/file/d/1gtr7CtLtyIirQ4ZyZT17ujXcROyHdfYe/view?usp=drive_link" },
  { nombre: "Christopher José Barahona Salas", rol: "Wicom - Costa Rica - Tier 1 / 2", ubicacion: "Bagaces, Guanacaste, Costa Rica", lat: 10.5106, lng: -85.2394, distancia: 68.6, honorario: 720000, cv: "https://drive.google.com/file/d/1dByoyWgl8ThWDY3_Iqc3nvsg7xGlG-q6/view?usp=drive_link" },
  { nombre: "Jose Pablo Morales Lopez", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "San José, Costa Rica", lat: 9.9281, lng: -84.0907, distancia: 167.0, honorario: 900000, cv: "https://drive.google.com/file/d/1XHfzPm167nbfYuRppyXTH2s4GszOGY6L/view?usp=drive_link" },
  { nombre: "Brandon Chavarría López", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Siquirres, Costa Rica", lat: 10.0950, lng: -83.5150, distancia: 219.2, honorario: 1100000, cv: "https://drive.google.com/file/d/1vdZnGXkJwMGVchjTaCSRRhAbzxM1wtoJ/view?usp=drive_link" },
  { nombre: "Randall Alberto Murillo Zamora", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Cartago, Costa Rica", lat: 9.8630, lng: -83.9170, distancia: 270.0, honorario: 750000, cv: "https://drive.google.com/file/d/1SdwM_UpUsJEKUM5DW5Ux1R0PUbBjMxfy/view?usp=drive_link" },
  { nombre: "Lester Sanchez Flores", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Alajuela, Costa Rica", lat: 10.0159, lng: -84.2116, distancia: 243.0, honorario: 1200000, cv: "https://drive.google.com/file/d/1h4kIimUqcLUi9Ji4clnMWGRGFhD-FbN7/view?usp=drive_link" },
  { nombre: "Jose Corrales Mora", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Curridabat, Costa Rica", lat: 9.9167, lng: -84.0333, distancia: 259.0, honorario: 900000, cv: "https://drive.google.com/file/d/1l1hsP74XLUnvAoBqZ7MSuNFHYHBu-z8h/view?usp=drive_link" },
  { nombre: "Geiner Picado Cerdas", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Cartago, Costa Rica", lat: 9.8630, lng: -83.9170, distancia: 270.0, honorario: 650000, cv: "https://drive.google.com/file/d/1RFcRY9Y0Ts_X08dLY0XIYykgppoTcyGA/view?usp=drive_link" },
  { nombre: "Jorge Rolando Barquero Gutierrez", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Cartago, Costa Rica", lat: 9.8630, lng: -83.9170, distancia: 270.0, honorario: 950000, cv: "https://drive.google.com/file/d/1WN0IMdaDow2LTDzBQaMI-88Rrigygg9E/view?usp=drive_link" },
  { nombre: "Gilberth Jiménez Prendas", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "San José, Costa Rica", lat: 9.9281, lng: -84.0907, distancia: 167.0, honorario: 1000000, cv: "https://drive.google.com/file/d/1EJHaTAjGqZV5AZBT3gbH4aAEtovxR5W9/view?usp=drive_link" },
  { nombre: "Esteban Mesen Centeno", rol: "Wicom - Costa Rica - Tier 3 / 4", ubicacion: "Cartago, Costa Rica", lat: 9.8630, lng: -83.9170, distancia: 270.0, honorario: 1100000, cv: "https://drive.google.com/file/d/13ugINPYaUZQEDnmnRSUmFWVQp_7Aju1I/view?usp=drive_link" },
  { nombre: "Francisco Gomez Calderon", rol: "Wicom - Costa Rica - Albañil", ubicacion: "Santa Cruz, Guanacaste, Costa Rica", lat: 10.2605, lng: -85.5851, distancia: 48.0, honorario: 650000, cv: "https://drive.google.com/file/d/1f6nG5_3d_2It2dhDnIb43Ed-JC9V3nju/view?usp=drive_link" },
  { nombre: "Jordy Antonio Gonzalez Martinez", rol: "Wicom - Costa Rica - Peon de Obra", ubicacion: "Sardinal de Carrillo, Guanacaste, Costa Rica", lat: 10.5174, lng: -85.6475, distancia: 36.0, honorario: 400000, cv: "https://drive.google.com/file/d/1JAErwv7jA-3meEaDucnjCWL2fs_Ck0mO/view?usp=drive_link" },
  { nombre: "Luis Alonso Jimenez", rol: "Wicom - Costa Rica - Jefe de obra", ubicacion: "Santa Cruz, Guanacaste, Costa Rica", lat: 10.2605, lng: -85.5851, distancia: 48.0, honorario: 1253135, cv: "https://drive.google.com/file/d/1TsOqKhuNc__HhK8eugMmL4ro4tEz8arY/view?usp=sharing" },
  { nombre: "Juan Diego Ospina Ardila", rol: "Wicom - Costa Rica - Jefe de obra", ubicacion: "Tilarán, Costa Rica", lat: 10.4700, lng: -84.9720, distancia: 134.0, honorario: 1800000, cv: "https://drive.google.com/file/d/1v1vfRYRkJxGJLYtkpE5WucfjBMCHtkyC/view?usp=sharing" },
  { nombre: "Marvin Antonio Roque Álvarez", rol: "Wicom - Costa Rica - Jefe de obra", ubicacion: "Guanacaste, Costa Rica", lat: 10.2605, lng: -85.5851, distancia: 48.0, honorario: 1900000, cv: "https://drive.google.com/file/d/1Ihz9fwzIi8p8UmB-gTNsjL2yEyCSJIye/view?usp=sharing" }
];

const colors = [
  "#59d18a", "#5aa9e6", "#e6c65a", "#e6905a", "#b0b8cc",
  "#c77dff", "#4cc9f0", "#f72585", "#7bdff2", "#ffb703",
  "#8ecae6", "#fb8500", "#219ebc", "#ef476f", "#06d6a0",
  "#118ab2", "#ffd166", "#073b4c", "#adb5bd", "#e63946",
  "#2a9d8f"
];
data.forEach((d, i) => { d.color = colors[i % colors.length]; });

function tierClass(rol) {
  const r = rol.toLowerCase();
  if (r.includes("1 / 2")) return "tier1";
  if (r.includes("3 / 4")) return "tier2";
  if (r.includes("jefe de obra")) return "tier3";
  if (r.includes("albañil")) return "tier4";
  return "tier5";
}

function roleLabel(rol) {
  return rol.replace("Wicom - Costa Rica - ", "");
}

function nombreCell(d) {
  return `<a class="cv-link" href="${d.cv}" target="_blank" rel="noopener">${d.nombre}</a>`;
}

function fmtCRC(n) {
  return "₡" + n.toLocaleString("es-CR");
}

// ---- Detail table ----
const tableBody = document.getElementById("tableBody");
data.forEach(d => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${nombreCell(d)}</td>
    <td class="${tierClass(d.rol)}">${roleLabel(d.rol)}</td>
    <td>${d.ubicacion}</td>
    <td>${d.distancia.toFixed(1)}</td>
    <td>${fmtCRC(d.honorario)}</td>
    <td><a class="cv-link" href="${d.cv}" target="_blank" rel="noopener">Ver CV</a></td>
  `;
  tableBody.appendChild(tr);
});

// ---- Summary table (avg by role) ----
const rolesMap = {};
data.forEach(d => {
  const key = roleLabel(d.rol);
  if (!rolesMap[key]) rolesMap[key] = { count: 0, distSum: 0, honSum: 0 };
  rolesMap[key].count++;
  rolesMap[key].distSum += d.distancia;
  rolesMap[key].honSum += d.honorario;
});
const summaryBody = document.getElementById("summaryBody");
Object.keys(rolesMap).forEach(role => {
  const r = rolesMap[role];
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="${tierClass('Wicom - Costa Rica - ' + role)}">${role}</td>
    <td class="num">${r.count}</td>
    <td class="num">${(r.distSum / r.count).toFixed(1)}</td>
    <td class="num">${fmtCRC(Math.round(r.honSum / r.count))}</td>
  `;
  summaryBody.appendChild(tr);
});

// ---- Map ----
const map = L.map('map', { scrollWheelZoom: false }).setView([center.lat, center.lng], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

L.circleMarker([center.lat, center.lng], {
  radius: 9,
  color: "#ffffff",
  weight: 2,
  fillColor: "#ff4d4d",
  fillOpacity: 1
}).addTo(map).bindTooltip(center.nombre, { permanent: false, className: "dark-tip" });

data.forEach(d => {
  const marker = L.circleMarker([d.lat, d.lng], {
    radius: 7,
    color: "#ffffff",
    weight: 1.5,
    fillColor: d.color,
    fillOpacity: 0.9
  }).addTo(map);
  marker.bindTooltip(`${d.nombre} — ${d.distancia.toFixed(1)} km`, { className: "dark-tip" });
  marker.bindPopup(`
    <strong>${d.nombre}</strong><br>
    ${roleLabel(d.rol)}<br>
    ${d.ubicacion}<br>
    ${d.distancia.toFixed(1)} km · ${fmtCRC(d.honorario)}<br>
    <a href="${d.cv}" target="_blank" rel="noopener">Ver CV</a>
  `);
});

// ---- Charts ----
const distSorted = [...data].sort((a, b) => a.distancia - b.distancia);
const feeSorted = [...data].sort((a, b) => a.honorario - b.honorario);

new Chart(document.getElementById('distChart'), {
  type: 'bar',
  data: {
    labels: distSorted.map(d => d.nombre),
    datasets: [{
      data: distSorted.map(d => d.distancia),
      backgroundColor: distSorted.map(d => d.color)
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: "#9aa5b8" }, grid: { color: "#2a3348" } },
      y: { ticks: { color: "#9aa5b8", font: { size: 9.5 } }, grid: { display: false } }
    }
  }
});

new Chart(document.getElementById('feeChart'), {
  type: 'bar',
  data: {
    labels: feeSorted.map(d => d.nombre),
    datasets: [{
      data: feeSorted.map(d => d.honorario),
      backgroundColor: feeSorted.map(d => d.color)
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: {
        ticks: {
          color: "#9aa5b8",
          callback: (v) => "₡" + (v / 1000000).toFixed(1) + "M"
        },
        grid: { color: "#2a3348" }
      },
      y: { ticks: { color: "#9aa5b8", font: { size: 9.5 } }, grid: { display: false } }
    }
  }
});
</script>
</body>
</html>
